<header>
    <div class="intro">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#8083FF" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m6.75 7.5 3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0 0 21 18V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v12a2.25 2.25 0 0 0 2.25 2.25Z" />
        </svg>
        <h1 class="title">CodeTogether</h1>
    </div>
    <div class="stats">
        <h2>{{ time }} Live</h2>  
    </div>
    <button class="CodeBtn" [class.clicked]="isClicked" (click)="copie()">
        <h1>{{ isClicked ? 'copied' : 'Room'}}</h1>
        <h2>{{ code }}</h2>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 7.5V6.108c0-1.135.845-2.098 1.976-2.192.373-.03.748-.057 1.123-.08M15.75 18H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08M15.75 18.75v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5A3.375 3.375 0 0 0 6.375 7.5H5.25m11.9-3.664A2.251 2.251 0 0 0 15 2.25h-1.5a2.251 2.251 0 0 0-2.15 1.586m5.8 0c.065.21.1.433.1.664v.75h-6V4.5c0-.231.035-.454.1-.664M6.75 7.5H4.875c-.621 0-1.125.504-1.125 1.125v12c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V16.5a9 9 0 0 0-9-9Z" />
        </svg>
    </button>
</header>  
<div class="main">
    <div class="problem-panel">
        <div class="problem-bar">
            <button class="DesBtn" [class.active]="ActiveProblemTab === 'description'" (click)="ShowProblem()">description</button>
            <button class="ListBtn" [class.active]="ActiveProblemTab === 'problems'" (click)="ShowList()">problems</button>
        </div>
    </div>
    <div class="coding-panel">
        <div class="coding-bar">
            <select class="language-select" [(ngModel)]="selectedLanguage" name="language">
                <option value="cpp">
                    C++
                </option>
                <option value="c">
                    C
                </option>
                <option value="python">
                    Python
                </option>
                <option value="java">
                    Java
                </option>
                <option value="javascript">
                    JavaScript
                </option>
            </select>
        </div>
    </div>
    <div class="member-panel">
        <div class="member-bar">
            <button class="ChatBtn" [class.active]="MemberTab === 'Chat'" (click)="ToChat()"> 
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#8083FF" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
                </svg>
                Chat
            </button>
            <button class="MemberBtn" [class.active]="MemberTab === 'Member'" (click)="ToMember()">Member</button>
        </div>
    </div>
</div>
